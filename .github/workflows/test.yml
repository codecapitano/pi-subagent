name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The loader tests need a Pi installation. Install it outside the repo's
      # dependencies so the package itself keeps no runtime dependencies.
      - run: npm install --no-save --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
      - run: npm test
        env:
          PI_CORE_DIR: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
